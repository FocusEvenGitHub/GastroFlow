services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"

  cashier:
    build: .
    container_name: cashier
    volumes:
      - ./src/cashier:/var/www/html
      - ./src/common:/var/www/common
      - ./src/api:/var/www/api
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  kitchen:
    build: .
    container_name: kitchen
    volumes:
      - ./src/kitchen:/var/www/html
      - ./src/common:/var/www/common
      - ./src/api:/var/www/api
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

volumes:
  db_data:
