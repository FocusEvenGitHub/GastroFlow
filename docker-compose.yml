# Compose de PRODUÇÃO — o que um restaurante roda (spec 066).
#
# O código, o vendor/ e os assets estão DENTRO da imagem. Um `git checkout` na pasta não
# muda nada do que está no ar; só `docker compose up -d --build` troca a versão. Montado
# de fora só o que é dado ou configuração: o .env (somente leitura), o banco, a logo
# enviada e o log.
#
# Ordem ao subir: db saudável → migrate (bin/migrate com o código NOVO) → web e
# print-worker. Se uma migração falhar, web e print-worker novos não sobem — o código novo
# nunca atende antes do banco estar pronto para ele.
#
# A versão mostrada em /version vem do build:
#   GASTROFLOW_VERSION=$(git describe --tags --always) docker compose up -d --build
#
# Desenvolvimento usa docker-compose.dev.yml (código montado da pasta).

x-app: &app
  build:
    context: .
    args:
      GASTROFLOW_VERSION: ${GASTROFLOW_VERSION:-}
  # Tag fixa de propósito (spec 066): a versão vai dentro da imagem (arquivo VERSION), não
  # no nome. Com o nome dependendo de GASTROFLOW_VERSION, um `docker compose up -d` sem a
  # variável procuraria outra imagem, construiria uma nova com o que estiver na pasta e
  # trocaria a versão no ar sem o passo de atualização.
  image: gastroflow:local
  environment:
    DB_HOST: db
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    TZ: America/Sao_Paulo
  volumes:
    - ./.env:/var/www/html/.env:ro
    - uploads:/var/www/html/public/uploads
    - logs:/var/www/html/logs

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - db_data:/var/lib/mysql
      - ./common/sql/001_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Só no próprio servidor (spec 062): o app fala com o `db` pela rede do Docker.
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    # Por TCP de propósito: na primeira inicialização o MySQL roda um servidor temporário
    # sem rede enquanto carrega o schema, e o migrate não pode começar antes do fim disso.
    # A senha vai por MYSQL_PWD, fora da linha de comando.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  migrate:
    <<: *app
    command: php bin/migrate
    user: www-data
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    container_name: restaurant_web
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:80"
    restart: unless-stopped

  print-worker:
    <<: *app
    container_name: restaurant_print_worker
    command: php bin/worker print
    # Mesmo usuário do Apache: o log é compartilhado com o web.
    user: www-data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Sem porta publicada — o worker só consome a fila de impressão.

volumes:
  db_data:
  uploads:
  logs:
