name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurant
          MYSQL_USER: restuser
          MYSQL_PASSWORD: restpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      MYSQL_DATABASE: restaurant
      MYSQL_USER: restuser
      MYSQL_PASSWORD: restpass
      JWT_SECRET: ci-placeholder-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, xml, zip
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Fast checks run before anything that needs the database, so a malformed
      # manifest or a style slip fails in seconds instead of after a DB spin-up.
      - name: Validate composer.json
        run: composer validate --strict

      - name: Audit dependencies for known vulnerabilities
        run: composer audit

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Wait for MySQL and load base schema
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done
          mysql -h127.0.0.1 -uroot -proot "$MYSQL_DATABASE" < common/sql/001_schema.sql

      - name: Write .env for bin/migrate
        run: |
          cat > .env <<EOF
          DB_HOST=$DB_HOST
          MYSQL_DATABASE=$MYSQL_DATABASE
          MYSQL_USER=$MYSQL_USER
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          JWT_SECRET=$JWT_SECRET
          EOF

      - name: Run migrations
        run: php bin/migrate

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit --testsuite Smoke,Unit

      # The integration suite writes real rows, so it gets its own database. It refuses to
      # run if MYSQL_DATABASE_TEST is unset (skips) or equals MYSQL_DATABASE (fails).
      - name: Create integration test database
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE_TEST}
              CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON \`${MYSQL_DATABASE_TEST}\`.* TO '${MYSQL_USER}'@'%';
            FLUSH PRIVILEGES;"
        env:
          MYSQL_DATABASE_TEST: restaurant_test

      - name: Integration tests (PHPUnit, MySQL)
        run: vendor/bin/phpunit --testsuite Integration
        env:
          MYSQL_DATABASE_TEST: restaurant_test

      # Testes de navegador (spec 040). Rodam neste mesmo job, e não num job separado, porque
      # o banco restaurant_test e seu schema acabaram de ser construídos pelo passo acima —
      # um job separado teria que duplicar serviço MySQL, composer install, schema e migrações
      # para não reaproveitar nada. A falha continua dizendo qual camada quebrou, porque os
      # passos são nomeados.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # A instância de testes aponta para restaurant_test pela variável de ambiente: o
      # public/index.php usa Dotenv imutável e variables_order inclui E, então o ambiente
      # vence o arquivo .env. É o mesmo mecanismo do docker-compose.e2e.yml local.
      # tests/e2e/router.php é obrigatório: o servidor embutido do PHP não lê o
      # public/.htaccess, e é ele que manda caminho inexistente para o front controller.
      # Sem o roteador, /api/menu devolve 404 — foi assim que este job falhou na primeira vez.
      - name: Start app for browser tests (test database)
        run: |
          # PHP_CLI_SERVER_WORKERS é obrigatório: a tela da cozinha abre uma conexão SSE de
          # longa duração (/api/events/stream.php) e o `php -S` é single-threaded por padrão —
          # essa única conexão consome o único worker e trava todo o resto. Localmente passa
          # porque lá quem serve é o Apache.
          PHP_CLI_SERVER_WORKERS=8 MYSQL_DATABASE=restaurant_test \
            php -S 127.0.0.1:8081 -t public tests/e2e/router.php \
            > /tmp/e2e-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8081/api/menu && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8081/api/menu; then
            echo "O app não respondeu na 8081. Log do servidor:"
            cat /tmp/e2e-server.log
            exit 1
          fi

      # TEMPORÁRIO (spec 040): o job falhou com o servidor reportando blocked:false depois de
      # o helper escrever. Isto mostra QUAL banco cada lado usa, em vez de eu continuar
      # teorizando. Some assim que a causa for encontrada.
      - name: Diagnose which database each side uses
        run: |
          echo "--- status ANTES ---"
          curl -s http://127.0.0.1:8081/api/printer/status; echo
          echo "--- helper escreve o bloqueio ---"
          MYSQL_DATABASE=restaurant_test php -r '
            require "vendor/autoload.php";
            Dotenv\Dotenv::createImmutable(getcwd())->safeLoad();
            foreach (getenv() as $k => $v) { if (!array_key_exists($k, $_ENV)) { $_ENV[$k] = $v; } }
            $_ENV["MYSQL_DATABASE"] = getenv("MYSQL_DATABASE") ?: "restaurant_test";
            App\Database::boot(new App\Settings());
            echo "  helper escreveu em: ", Illuminate\Database\Capsule\Manager::connection()->selectOne("SELECT DATABASE() AS d")->d, "\n";
            App\Models\Setting::setValue("printer_blocked_at", date("Y-m-d H:i:s"));
            App\Models\Setting::setValue("printer_consecutive_failures", "3");'
          echo "--- status DEPOIS ---"
          curl -s http://127.0.0.1:8081/api/printer/status; echo
          echo "--- linhas em cada banco ---"
          mysql -h127.0.0.1 -uroot -proot -e \
            "SELECT 'restaurant' AS db, \`key\`, value FROM restaurant.settings WHERE \`key\` LIKE 'printer%'
             UNION ALL
             SELECT 'restaurant_test', \`key\`, value FROM restaurant_test.settings WHERE \`key\` LIKE 'printer%';"

      - name: Browser tests (Playwright)
        working-directory: tests/e2e
        run: npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
          E2E_PHP_DIRECT: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
