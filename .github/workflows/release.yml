name: Release

# Spec 072. A pushed release tag (vX.Y.Z or vX.Y.Z-suffix) publishes, in this order and only
# if every step before passes:
#   test    the full CI suite (ci.yml) on the tagged commit
#   notes   the tag's dated section exists in CHANGELOG.md
#   image   ghcr.io/focusevengithub/gastroflow — X.Y.Z (+ X.Y and X when it is the highest of
#           its line; pre-releases only the exact tag; never `latest`), amd64
#   release the GitHub Release, with the CHANGELOG section as notes
# Creating the tag stays a manual, owner-confirmed step (docs/COMMIT_CONVENTION.md).
#
# On a pull request that touches this file, the scripts or the Dockerfile, `dry-run` checks
# the same steps without publishing anything (no write permission, no registry login).

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/release-notes.sh
      - .github/scripts/image-tags.sh
      - Dockerfile

permissions:
  contents: read

env:
  IMAGE: ghcr.io/focusevengithub/gastroflow

jobs:
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  notes:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CHANGELOG section for this tag
        run: |
          .github/scripts/release-notes.sh --title "$GITHUB_REF_NAME"
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME"

  image:
    if: github.event_name == 'push'
    needs: notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Full history with tags: image-tags.sh compares this tag with the existing ones.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          docker build --platform linux/amd64 \
            --build-arg GASTROFLOW_VERSION="$GITHUB_REF_NAME" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="${GITHUB_REF_NAME#v}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t gastroflow:release .

      # /version reads this file (spec 066): the image must answer exactly the tag.
      - name: Smoke check (VERSION)
        run: |
          version=$(docker run --rm gastroflow:release cat /var/www/html/VERSION)
          echo "VERSION in the image: $version"
          test "$version" = "$GITHUB_REF_NAME"

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for t in $(.github/scripts/image-tags.sh "$GITHUB_REF_NAME"); do
            echo "Pushing $IMAGE:$t"
            docker tag gastroflow:release "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done

  release:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          title=$(.github/scripts/release-notes.sh --title "$tag")
          .github/scripts/release-notes.sh "$tag" > "$RUNNER_TEMP/notes.md"

          flags=()
          highest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -r | head -n1)
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          elif [ "$tag" = "$highest" ]; then
            flags+=(--latest)
          else
            flags+=(--latest=false)
          fi

          # Re-running the workflow for the same tag updates the release instead of failing.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          else
            gh release create "$tag" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi

  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes (newest dated CHANGELOG section)
        run: |
          tag=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)? \([0-9]{4}-[0-9]{2}-[0-9]{2}\)' CHANGELOG.md | awk '{print $2}')
          echo "Newest released version in CHANGELOG.md: $tag"
          .github/scripts/release-notes.sh --title "$tag"
          # To a file, then head: piping the script into head would fail on SIGPIPE (pipefail)
          # once a section is bigger than the pipe buffer.
          .github/scripts/release-notes.sh "$tag" > "$RUNNER_TEMP/notes.md"
          head -n 20 "$RUNNER_TEMP/notes.md"
          echo "--- the in-progress section must be refused:"
          if .github/scripts/release-notes.sh "$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | awk '{print $2}')" > /dev/null; then
            echo "(the newest section is dated — nothing in progress)"
          else
            echo "refused, as expected"
          fi

      - name: Image tags it would push
        run: |
          for t in v1.9.0 v1.8.4 v2.0.0-rc.1; do
            echo "$t → $(.github/scripts/image-tags.sh "$t" | tr '\n' ' ')"
          done

      - name: Build and smoke check (not pushed)
        run: |
          docker build --platform linux/amd64 --build-arg GASTROFLOW_VERSION=v0.0.0-dry-run \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            -t gastroflow:dry-run .
          version=$(docker run --rm gastroflow:dry-run cat /var/www/html/VERSION)
          echo "VERSION in the image: $version"
          test "$version" = "v0.0.0-dry-run"
